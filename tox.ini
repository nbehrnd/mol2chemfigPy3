[tox]
envlist = py310, py311, py312, py313
isolated_build = True
ignore_missing_interpreters = True

[testenv]
deps =
  pytest
commands =
  pytest -m "not network"

[testenv:connectivity]
deps =
  pytest
commands =
  pytest -m network

[pytest]
markers =
    network: requires live internet access to PubChem
